[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moonwalk-contributions"
version = "0.1.0"
description = "Generate a moonwalk animation from a GitHub contribution calendar."
requires-python = ">=3.12"
dependencies = ["Pillow>=12.0"]

[project.optional-dependencies]
dev = ["mypy>=1.15", "pytest>=8.0", "ruff>=0.11"]

[project.scripts]
moonwalk-contributions = "moonwalk_contributions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moonwalk_contributions = ["fonts/*.ttf", "fonts/*.txt"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["moonwalk_contributions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
