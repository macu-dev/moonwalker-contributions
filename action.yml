name: Moonwalker contribution animation
description: Generate an animated moonwalker from a GitHub contribution calendar.
author: macu-dev

inputs:
  github_user_name:
    description: GitHub username whose contribution calendar should be rendered.
    required: true
  github_token:
    description: Optional token for GitHub GraphQL; defaults to the workflow token.
    required: false
  output_dir:
    description: Relative directory in the caller workspace for the generated GIF and PNG.
    required: false
    default: assets

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install moonwalker generator
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$ACTION_PATH"

    - name: Generate contribution animation
      shell: bash
      env:
        GITHUB_USER_NAME: ${{ inputs.github_user_name }}
        GITHUB_TOKEN: ${{ inputs.github_token || github.token }}
        OUTPUT_DIR: ${{ inputs.output_dir }}
      run: |
        set -euo pipefail
        if [[ -z "$GITHUB_USER_NAME" ]]; then
          echo "Provide the github_user_name input." >&2
          exit 1
        fi
        OUTPUT_DIR="$(python - <<'PY'
        import os
        from pathlib import Path

        workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
        requested = Path(os.environ["OUTPUT_DIR"])
        if requested.is_absolute():
            raise SystemExit("output_dir must be relative to the workflow workspace.")
        resolved = (workspace / requested).resolve()
        if resolved != workspace and workspace not in resolved.parents:
            raise SystemExit("output_dir must stay inside the workflow workspace.")
        print(resolved)
        PY
        )"
        moonwalk-contributions \
          --username "$GITHUB_USER_NAME" \
          --output-dir "$OUTPUT_DIR"
