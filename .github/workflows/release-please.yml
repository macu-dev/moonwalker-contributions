name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recover_tag:
        description: 'Tag completo existente para recuperar (vacío para el flujo normal)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/quality.yml

  prepare:
    needs: quality
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      candidate: ${{ steps.candidate.outputs.result }}
      sha: ${{ steps.candidate.outputs.sha }}
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require application configuration and preflight evidence
        uses: actions/github-script@v8
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          RELEASE_PREFLIGHT_URL: ${{ vars.RELEASE_PREFLIGHT_URL }}
        with:
          script: require('./scripts/release.cjs').requireActivation(process.env, false);
      - name: Create temporary installation token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Inspect existing releases before invoking Release Please
        id: pending
        uses: actions/github-script@v8
        env:
          RECOVER_TAG: ${{ inputs.recover_tag }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const release = require('./scripts/release.cjs');
            const repo = (await github.rest.repos.get(context.repo)).data;
            if (!repo.allow_squash_merge) throw new Error('Habilitar squash merge antes de preparar releases.');
            await github.paginate(github.rest.repos.listTags, {...context.repo, per_page: 100});
            const candidate = release.selectRelease(await release.releases(github, context.repo), process.env.RECOVER_TAG);
            if (candidate) await release.checkTag(github, context.repo, candidate);
            core.setOutput('pending', Boolean(candidate));
      - name: Create release draft only
        if: steps.pending.outputs.pending == 'false' && inputs.recover_tag == '' && vars.RELEASE_AUTOMATION_ENABLED == 'true'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app.outputs.token }}
          target-branch: main
          skip-github-pull-request: true
      - name: Select immutable release target
        id: candidate
        uses: actions/github-script@v8
        env:
          RECOVER_TAG: ${{ inputs.recover_tag }}
          RELEASE_AUTOMATION_ENABLED: ${{ vars.RELEASE_AUTOMATION_ENABLED }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const release = require('./scripts/release.cjs');
            const candidate = release.selectRelease(await release.releases(github, context.repo), process.env.RECOVER_TAG);
            if (candidate && process.env.RELEASE_AUTOMATION_ENABLED !== 'true') {
              throw new Error('Borrador/recuperación pendiente: completar la activación antes de continuar.');
            }
            if (candidate) {
              await release.checkTag(github, context.repo, candidate);
              core.setOutput('sha', candidate.sha);
              core.setOutput('tag', candidate.tag);
            }
            return candidate;
      - name: Prepare cumulative release PR only when no draft is pending
        if: steps.candidate.outputs.result == 'null' && inputs.recover_tag == ''
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app.outputs.token }}
          target-branch: main
          skip-github-release: true

  validate-target:
    needs: prepare
    if: needs.prepare.outputs.sha != ''
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      release_tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, validate-target]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      # The publisher always comes from the workflow revision, never from an old recovery tag.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require completed activation
        uses: actions/github-script@v8
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          RELEASE_PREFLIGHT_URL: ${{ vars.RELEASE_PREFLIGHT_URL }}
          RELEASE_AUTOMATION_ENABLED: ${{ vars.RELEASE_AUTOMATION_ENABLED }}
        with:
          script: require('./scripts/release.cjs').requireActivation(process.env);
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Publish validated draft and recover major alias
        uses: actions/github-script@v8
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          VALIDATED_SHA: ${{ needs.prepare.outputs.sha }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            await require('./scripts/release.cjs').publish(
              github, context.repo, JSON.parse(process.env.CANDIDATE), process.env.VALIDATED_SHA
            );
