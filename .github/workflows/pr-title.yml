name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      # Metadata only: no checkout, no secrets, no execution of PR contents.
      - uses: actions/github-script@v8
        with:
          script: |
            const pattern = /^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([^\r\n()]+\))?!?: \S[^\r\n]*$/;
            if (!pattern.test(context.payload.pull_request.title)) {
              core.setFailed('Usar Conventional Commits: feat: descripción, fix: descripción o feat!: cambio incompatible.');
            }
